<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#475569;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#334155;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="towel1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f1f5f9;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)" rx="12"/>
  <!-- Stacked towels -->
  <rect x="150" y="360" width="300" height="100" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="155" y="340" width="290" height="30" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="160" y="320" width="280" height="25" rx="4" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="165" y="305" width="270" height="20" rx="4" fill="#cbd5e1"/>
  <!-- Folded towel on top -->
  <rect x="180" y="150" width="240" height="160" rx="12" fill="url(#towel1)" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="200" y="170" width="200" height="8" rx="2" fill="#e2e8f0" opacity="0.6"/>
  <rect x="200" y="190" width="200" height="8" rx="2" fill="#e2e8f0" opacity="0.6"/>
  <rect x="200" y="210" width="200" height="8" rx="2" fill="#e2e8f0" opacity="0.6"/>
  <text x="300" y="510" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="bold" font-family="Arial" opacity="0.9">Cotton Bath Towel Set</text>
  <text x="300" y="538" text-anchor="middle" fill="#cbd5e1" font-size="14" font-family="Arial">Premium Cotton ● 6-Piece Set ● White</text>
</svg>